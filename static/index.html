<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4fa">
  <meta name="description" content="Build, evaluate, and test grounded agents from your documents.">
  <title>ForgeAI Studio</title>
  <link rel="icon" href="/static/forge-icon.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a id="skip-link" class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <button id="menu-backdrop" class="menu-backdrop" data-action="close-menu" type="button" tabindex="-1" aria-hidden="true" hidden></button>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#build" aria-label="ForgeAI home">
        <span class="brand-symbol" data-icon="layers"></span>
        <span>Forge<span class="brand-accent">AI</span><small>AGENT STUDIO</small></span>
      </a>
      <button id="close-menu" class="icon-button close-menu" data-action="close-menu" data-icon="close" type="button" aria-label="Close workspace navigation"></button>
      <span class="nav-label">WORKSPACE</span>
      <nav id="nav" aria-label="Workspace"></nav>
      <div class="sidebar-bottom">
        <div class="runtime-card">
          <span class="runtime-icon" data-icon="cpu"></span>
          <div><strong id="runtime-title">Checking runtime</strong><small id="runtime-subtitle">Local inference</small></div>
          <span class="runtime-dot" id="runtime-dot"></span>
        </div>
        <a href="/project-download" class="side-link"><span data-icon="download"></span>Download project</a>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumbs"><button id="open-menu" class="icon-button mobile-menu" data-action="menu" aria-label="Open workspace navigation" aria-controls="sidebar" aria-expanded="false" data-icon="menu" type="button"></button><span class="crumb-root">Workspace</span><span class="crumb-chevron" data-icon="chevron-right"></span><strong id="page-name">Agent factory</strong></div>
        <div class="topbar-actions">
          <span class="local-pill"><span></span> Local workspace</span>
          <div class="theme-control" role="group" aria-label="Color theme">
            <button type="button" data-theme-choice="light" data-icon="sun" title="Light" aria-label="Light theme" aria-pressed="false"></button>
            <button type="button" data-theme-choice="dark" data-icon="moon" title="Dark" aria-label="Dark theme" aria-pressed="false"></button>
            <button type="button" data-theme-choice="system" data-icon="monitor" title="Match device" aria-label="Match device theme" aria-pressed="true"></button>
          </div>
        </div>
      </header>
      <main id="main" tabindex="-1" aria-label="ForgeAI workspace"></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
