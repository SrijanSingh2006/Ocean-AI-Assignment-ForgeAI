[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai-factory"
version = "1.0.0"
description = "Local, evidence-driven agent factory"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pillow>=10,<13"]
languages = ["ctranslate2>=4,<5", "sentencepiece>=0.2,<1", "tokenizers>=0.20,<1", "onnxruntime>=1.20,<2"]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools]
packages = ["forgeai"]
