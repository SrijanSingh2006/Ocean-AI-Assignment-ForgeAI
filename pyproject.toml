[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai-factory"
version = "1.0.0"
description = "Local, evidence-driven agent factory"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "pypdf>=5,<7", "python-docx>=1.1,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
forgeai = "forgeai.cli:main"

[tool.setuptools]
packages = ["forgeai"]
